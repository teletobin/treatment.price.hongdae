<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>시술가격 검색 정리</title>
  <!-- Pretendard Font -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
  <style>
    :root {
      color-scheme: light;
      --bg: #ffffff; 
      --primary: #f06292;
      --primary-dark: #d81b60; 
      --primary-light: #fce4ec;
      --text: #424242; /* Sophisticated dark grey */
      --text-sub: #757575; 
      --card-bg: #ffffff;
      --border: rgba(240, 98, 146, 0.2);
      --shadow: 0 4px 20px rgba(0, 0, 0, 0.05); 
      --radius: 20px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      font-family: "Pretendard", "Noto Sans KR", sans-serif !important;
      color: var(--text);
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 15px 20px;
      text-align: center;
      background: var(--primary-light); 
      border-bottom: 2px solid rgba(240, 98, 146, 0.1);
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 15px rgba(240, 98, 146, 0.05);
    }

    header h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.7px;
    }

    .main-wrapper {
      flex: 1;
      max-width: 1600px;
      margin: 0 auto;
      padding: 20px;
      width: 100%;
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      width: 100%;
    }

    @media (max-width: 600px) {
      .grid-container {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      border: 1px solid var(--border);
      min-height: 850px; 
    }

    .section-title {
      font-size: 18px; 
      font-weight: 700;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .title-text {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .title-text::before {
      content: '';
      display: inline-block;
      width: 5px;
      height: 18px;
      background: var(--primary);
      border-radius: 2px;
    }

    textarea {
      width: 100%;
      flex: 1; 
      padding: 18px;
      border-radius: 14px;
      border: 1px solid var(--border);
      font-size: 14px;
      line-height: 1.7;
      resize: none;
      outline: none;
      background: #fffafa;
      transition: all 0.2s;
      color: var(--text);
    }

    textarea:focus {
      border-color: var(--primary);
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(240, 98, 146, 0.05);
    }

    .search-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 16px;
    }

    .search-inputs-row, .exclude-inputs-row {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .input-group {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px; 
      flex: 1;
    }

    .label-tag {
      font-size: 14px; 
      font-weight: 800;
      color: var(--text); 
      white-space: nowrap;
      width: 45px; 
      text-align: center;
    }

    input[type="text"] {
      width: 100%;
      padding: 10px 8px;
      border-radius: 10px;
      border: 1px solid var(--border);
      font-size: 13px;
      font-weight: 600;
      outline: none;
      transition: all 0.2s;
      color: var(--text);
    }

    input[type="text"]:focus {
      border-color: var(--primary);
      background: #fff;
    }

    .exclude-input {
      background: #f8f8f8;
      border-color: #eee;
    }

    .exclude-input:focus {
      border-color: #9e9e9e;
      background: #fff;
    }

    .btn {
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: 700;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .btn-action {
      background: var(--primary);
      color: white;
      padding: 10px 15px;
      border-radius: 10px;
      font-size: 13px;
      height: 39px; 
      box-shadow: 0 4px 10px rgba(240, 98, 146, 0.2);
      white-space: nowrap;
      min-width: 55px;
    }

    .btn-action:hover {
      background: var(--primary-dark);
      transform: translateY(-1px);
    }

    .btn-exclude {
      background: #e0e0e0;
      color: #616161;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.04);
    }

    .btn-exclude:hover {
      background: #bdbdbd;
      color: #424242;
      transform: translateY(-1px);
    }

    .btn-copy-small {
      background: var(--primary);
      color: white;
      padding: 0 20px;
      border-radius: 50px;
      font-size: 12px;
      height: 38px; 
      margin-left: auto;
      box-shadow: 0 4px 10px rgba(240, 98, 146, 0.2);
    }

    .btn-copy-small:hover {
      background: var(--primary-dark);
      transform: translateY(-1px);
    }

    .btn-header-action {
      height: 32px; 
      padding: 0 14px;
      font-size: 11px;
      font-weight: 800;
      border-radius: 50px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .btn-clear {
      background: var(--primary-light);
      border: 1px solid rgba(240, 98, 146, 0.2);
      color: var(--primary-dark);
      letter-spacing: 0.5px;
    }

    .btn-clear:hover {
      background: #f8bbd0;
    }

    .btn-link-site {
      background: #ffffff;
      border: 1px solid var(--border);
      color: var(--primary-dark);
      box-shadow: 0 2px 6px rgba(240, 98, 146, 0.05);
      margin-right: 6px;
    }

    .btn-link-site:hover {
      background: var(--primary-light);
      border-color: var(--primary);
    }

    .card-footer-options {
      margin-top: 16px;
      display: flex;
      align-items: center; 
      flex-wrap: wrap;
      gap: 10px;
      padding-top: 16px;
      border-top: 1px dashed var(--border);
    }

    .option-pill {
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 0 14px;
      height: 38px; 
      border-radius: 50px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(240, 98, 146, 0.04);
      transition: all 0.2s ease;
    }

    .option-pill:hover {
      border-color: var(--primary);
      transform: translateY(-1px);
    }

    .option-pill input {
      accent-color: var(--primary);
      width: 15px;
      height: 15px;
      margin: 0;
    }

    .count-badge {
      font-size: 11px;
      font-weight: 700;
      color: var(--primary-dark);
      background: var(--primary-light);
      padding: 3px 10px;
      border-radius: 20px;
    }

    footer {
      padding: 20px 0;
      text-align: center;
      font-size: 13px;
      color: var(--text-sub);
      letter-spacing: 0.3px;
      font-weight: 500;
      margin-top: 10px;
    }

    #toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #333;
      color: white;
      padding: 12px 24px;
      border-radius: 50px;
      font-size: 13px;
      transition: transform 0.3s ease;
      z-index: 1000;
    }

    #toast.show { transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

<header>
  <h1>블리비의원 시술가격 검색 및 정리</h1>
</header>

<div class="main-wrapper">
  <div class="grid-container">
    <!-- Left: Data Input -->
    <div class="card">
      <div class="section-title">
        <div class="title-text">원본 데이터 입력</div>
        <div style="display: flex; align-items: center;">
          <a href="https://www.velyb.kr/community/community01.php?tb=event2&etc5=%ED%99%8D%EB%8C%80%EC%A0%90&intGP=&style=&sField=2" target="_blank" class="btn btn-header-action btn-link-site">홍대점 홈페이지</a>
          <button class="btn btn-header-action btn-clear" onclick="clearAll()">CLEAR</button>
        </div>
      </div>

      <textarea id="dataInput" placeholder="블리비 홈페이지에서 시술명+가격데이터를 붙여넣으면 즉시 추출됩니다." oninput="updateData()"></textarea>
      
      <div style="margin-top: 16px; display: flex; justify-content: flex-end;">
          <span id="inputStatus" class="count-badge">READY</span>
      </div>
    </div>

    <!-- Right: Search and Result Editing -->
    <div class="card">
      <div class="section-title">
        <div class="title-text">정리 결과 및 추출 검색</div>
        <span id="resultCount" class="count-badge">0건</span>
      </div>

      <div class="search-grid">
        <div class="search-inputs-row">
          <div class="label-tag">포함</div>
          <div class="input-group">
            <input type="text" class="search-input" placeholder="키워드 1" onkeyup="handleSearchKey(event)">
            <input type="text" class="search-input" placeholder="키워드 2" onkeyup="handleSearchKey(event)">
            <input type="text" class="search-input" placeholder="키워드 3" onkeyup="handleSearchKey(event)">
          </div>
          <button class="btn btn-action" onclick="performExtraction()">검색</button>
        </div>
        
        <div class="exclude-inputs-row">
          <div class="label-tag">제외</div>
          <div class="input-group">
            <input type="text" class="exclude-input" placeholder="제외 1" onkeyup="handleSearchKey(event)">
            <input type="text" class="exclude-input" placeholder="제외 2" onkeyup="handleSearchKey(event)">
            <input type="text" class="exclude-input" placeholder="제외 3" onkeyup="handleSearchKey(event)">
          </div>
          <button class="btn btn-action btn-exclude" onclick="performExtraction()">제외</button>
        </div>
      </div>

      <textarea id="resultBox" placeholder="-추출된 텍스트는 편집 가능합니다. <div>
        -원본 텍스트 중 포함할 단어와 제외할 단어를 입력해 편리하게 이용하세요. 
        -키워드는 콤마(,)로도 구분 가능합니다." oninput="handleManualEdit()"></textarea>

      <div class="card-footer-options">
        <label class="option-pill">
          <input type="checkbox" id="keepParens" checked onchange="handleOptionChange()">
          <span>괄호 속 텍스트 유지</span>
        </label>
        <label class="option-pill">
          <input type="checkbox" id="vatLine" checked onchange="handleOptionChange()">
          <span>부가세 안내 포함</span>
        </label>
        
        <button class="btn btn-copy-small" onclick="copyResult()">텍스트 복사</button>
      </div>
    </div>
  </div>

  <footer>
    &copy; 2026. Designed & Developed by EUNBIN GA
  </footer>
</div>

<div id="toast">복사 완료!</div>

<script>
  // [내부 고정 데이터베이스]
  const CUSTOM_DATABASE = [
    { name: "셀바이브(프리미엄LDM) 6분 1회", price: "29,000원" },
    { name: "셀바이브(프리미엄LDM) 6분 5회", price: "139,000원" },
    { name: "셀바이브(프리미엄LDM) 12분 1회", price: "55,000원" },
    { name: "셀바이브(프리미엄LDM) 12분 5회", price: "250,000원" },
    { name: "셀바이브(프리미엄LDM) 24분 1회", price: "105,000원" },
    { name: "셀바이브(프리미엄LDM) 24분 5회", price: "550,000원" },
    { name: "엔바이론 이온자임(고농도 비타민 침투) 체험가", price: "69,000원" },
    { name: "엔바이론 이온자임(고농도 비타민 침투)", price: "79,000원" },
    { name: "엔바이론 이온자임(고농도 비타민 침투) 5회", price: "390,000원" },
    { name: "서브시전 얼굴전체", price: "150,000원" },
    { name: "서브시전 1부위", price: "100,000원" },
    { name: "쥬베룩스킨 2cc(눈밑 케뉼라시술)", price: "220,000원" },
    { name: "올리디아스킨 2cc(눈밑 케뉼라시술)", price: "250,000원" },
    { name: "블리비V주사 1회", price: "100,000원" },
    { name: "블리비V주사 3회", price: "250,000원" },
    { name: "블리비V주사 3개월 책임제", price: "600,000원" },
    { name: "코 조각주사 1회", price: "50,000원" },
    { name: "코 조각주사 3회", price: "99,000원" },
    { name: "주름필러(이마/미간/콧등주름 등)1cc", price: "350,000원" }
  ];

  let treatmentData = [];
  let isEditingOutput = false;

  function cleanName(name, keepParens) {
    let n = name;
    if (!keepParens) {
      n = n.replace(/\([^)]*\)/g, ""); 
      n = n.replace(/\[[^\]]*\]/g, ""); 
    }
    return n.replace(/\s+/g, " ").trim();
  }

  function extractPrice(text) {
    if (!text) return null;
    const match = text.match(/(\d{1,3}(,\d{3})*|\d+)원/);
    return match ? match[0] : null;
  }

  function handleOptionChange() {
    isEditingOutput = false;
    const hasAnyKeyword = Array.from(document.querySelectorAll('.search-input, .exclude-input'))
                               .some(input => input.value.trim().length > 0);
    if (hasAnyKeyword) {
      performExtraction();
    } else {
      updateData(); 
    }
  }

  function handleManualEdit() {
    isEditingOutput = true;
    document.getElementById('resultCount').innerText = "편집 중";
  }

  function handleSearchKey(e) {
    if(e.keyCode === 13) {
      performExtraction();
    }
  }

  function updateData() {
    const rawText = document.getElementById('dataInput').value.trim();
    let parsedData = [];
    if (rawText) {
      const lines = rawText.split('\n').map(l => l.trim()).filter(l => l.length > 0);
      for (let i = 0; i < lines.length; i++) {
        const currentLine = lines[i];
        const priceInCurrent = extractPrice(currentLine);
        if (priceInCurrent) {
          const namePart = currentLine.split(priceInCurrent)[0].trim();
          if (namePart && namePart.length > 1) {
            parsedData.push({ name: namePart, price: priceInCurrent });
            continue;
          }
        }
        const nextLine = lines[i + 1] || "";
        const priceInNext = extractPrice(nextLine);
        if (priceInNext && !/%|할인|이벤트/.test(currentLine) && !/\d원/.test(currentLine)) {
          parsedData.push({ name: currentLine, price: priceInNext });
          i++;
        }
      }
    }
    treatmentData = parsedData;
    document.getElementById('inputStatus').innerText = `${treatmentData.length}건 분석됨`;
    
    if (!isEditingOutput) {
      const hasAnyKeyword = Array.from(document.querySelectorAll('.search-input, .exclude-input'))
                                     .some(input => input.value.trim().length > 0);
      if (hasAnyKeyword) {
        performExtraction(); 
      } else {
        renderResult(treatmentData); 
      }
    }
  }

  function renderResult(dataList) {
    const useVat = document.getElementById('vatLine').checked;
    const keepParens = document.getElementById('keepParens').checked;

    let finalTxt = dataList.map(item => {
      const displayName = cleanName(item.name, keepParens);
      return `${displayName} ${item.price}`;
    }).filter(line => line.trim() !== "").join('\n');
    
    if (useVat && dataList.length > 0) {
      finalTxt += (finalTxt ? "\n\n" : "") + "부가세 10% 별도입니다 😊";
    }
    
    document.getElementById('resultBox').value = finalTxt;
    document.getElementById('resultCount').innerText = `${dataList.length}건`;
  }

  function performExtraction() {
    const searchInputs = document.querySelectorAll('.search-input');
    const excludeInputs = document.querySelectorAll('.exclude-input');
    const rawInputText = document.getElementById('dataInput').value.trim();
    isEditingOutput = false; 

    let allKeywords = [];
    searchInputs.forEach(input => {
      const val = input.value.trim();
      if (val) {
        const kws = val.split(',').map(k => k.replace(/\s+/g, "").toLowerCase()).filter(k => k.length > 0);
        allKeywords = [...allKeywords, ...kws];
      }
    });

    let excludeKeywords = [];
    excludeInputs.forEach(input => {
      const val = input.value.trim();
      if (val) {
        const kws = val.split(',').map(k => k.replace(/\s+/g, "").toLowerCase()).filter(k => k.length > 0);
        excludeKeywords = [...excludeKeywords, ...kws];
      }
    });

    // 핵심 수정 로직: 
    // 원본 데이터(rawInputText)가 있으면 내장 DB(CUSTOM_DATABASE)를 무시하고 
    // 입력된 데이터(treatmentData)에서만 검색합니다.
    let sourceData = [];
    if (rawInputText.length > 0) {
      // 데이터가 입력된 상태면 붙여넣은 데이터만 사용
      sourceData = [...treatmentData];
    } else {
      // 데이터 입력칸이 비어있으면 내장 DB 사용
      sourceData = [...CUSTOM_DATABASE];
    }

    let filtered = sourceData;

    if (allKeywords.length > 0) {
      filtered = filtered.filter(item => {
        const cleanItemName = item.name.replace(/\s+/g, "").toLowerCase();
        return allKeywords.some(kw => cleanItemName.includes(kw));
      });
    }

    if (excludeKeywords.length > 0) {
      filtered = filtered.filter(item => {
        const cleanItemName = item.name.replace(/\s+/g, "").toLowerCase();
        return !excludeKeywords.some(exKw => cleanItemName.includes(exKw));
      });
    }

    renderResult(filtered);
  }

  function clearAll() {
    document.getElementById('dataInput').value = "";
    document.getElementById('resultBox').value = "";
    document.querySelectorAll('.search-input').forEach(input => input.value = "");
    document.querySelectorAll('.exclude-input').forEach(input => input.value = "");
    treatmentData = [];
    isEditingOutput = false;
    document.getElementById('inputStatus').innerText = "READY";
    document.getElementById('resultCount').innerText = "0건";
  }

  function copyResult() {
    const resultBox = document.getElementById('resultBox');
    const text = resultBox.value;
    if (!text) return;

    const tempElem = document.createElement("textarea");
    tempElem.value = text;
    document.body.appendChild(tempElem);
    tempElem.select();
    
    try {
      document.execCommand('copy');
      const toast = document.getElementById('toast');
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    } catch (err) {}
    document.body.removeChild(tempElem);
  }
</script>
</body>
</html>
