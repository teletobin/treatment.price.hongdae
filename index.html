<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>시술가격 검색 정리</title>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
  <style>
    :root {
      color-scheme: light;
      --bg: #ffffff;
      --primary: #f06292;
      --primary-dark: #d81b60;
      --primary-light: #fce4ec;
      --text: #424242;
      --text-sub: #757575;
      --card-bg: #ffffff;
      --border: rgba(240, 98, 146, 0.2);
      --shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      --radius: 20px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      font-family: "Pretendard", "Noto Sans KR", sans-serif !important;
      color: var(--text);
    }

    body {
      margin: 0; padding: 0;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
      display: flex; flex-direction: column;
    }

    header {
      padding: 15px 20px;
      text-align: center;
      background: var(--primary-light);
      border-bottom: 2px solid rgba(240, 98, 146, 0.1);
      position: sticky; top: 0; z-index: 100;
      box-shadow: 0 4px 15px rgba(240, 98, 146, 0.05);
    }

    header h1 {
      margin: 0; font-size: 20px; font-weight: 700;
      color: var(--text); letter-spacing: -0.7px;
    }

    .main-wrapper {
      flex: 1; max-width: 1600px;
      margin: 0 auto; padding: 20px; width: 100%;
    }

    .grid-container {
      display: grid; grid-template-columns: repeat(2, 1fr);
      gap: 20px; width: 100%;
    }
    @media (max-width: 600px) {
      .grid-container { grid-template-columns: 1fr; }
    }

    .card {
      background: var(--card-bg); border-radius: var(--radius);
      padding: 24px; box-shadow: var(--shadow);
      display: flex; flex-direction: column;
      border: 1px solid var(--border); min-height: 850px;
    }

    .section-title {
      font-size: 18px; font-weight: 700; margin-bottom: 20px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .title-text {
      display: flex; align-items: center; gap: 10px;
    }
    .title-text::before {
      content: ''; display: inline-block;
      width: 5px; height: 18px;
      background: var(--primary); border-radius: 2px;
    }

    textarea {
      width: 100%; flex: 1; padding: 18px;
      border-radius: 14px; border: 1px solid var(--border);
      font-size: 14px; line-height: 1.7; resize: none; outline: none;
      background: #fffafa; transition: all 0.2s; color: var(--text);
    }
    textarea:focus {
      border-color: var(--primary); background: #ffffff;
      box-shadow: 0 0 0 3px rgba(240, 98, 146, 0.05);
    }

    .search-grid { display: flex; flex-direction: column; gap: 12px; margin-bottom: 16px; }
    .search-inputs-row, .exclude-inputs-row { display: flex; gap: 10px; align-items: center; }
    .input-group { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; flex: 1; }
    .label-tag {
      font-size: 14px; font-weight: 800; color: var(--text);
      white-space: nowrap; width: 45px; text-align: center;
    }

    input[type="text"], select {
      width: 100%; padding: 10px 8px; border-radius: 10px;
      border: 1px solid var(--border); font-size: 13px; font-weight: 600;
      outline: none; transition: all 0.2s; color: var(--text); background: #fff;
    }
    input[type="text"]:focus, select:focus { border-color: var(--primary); background: #fff; }
    .exclude-input { background: #f8f8f8; border-color: #eee; }
    .exclude-input:focus { border-color: #9e9e9e; background: #fff; }

    .btn {
      border: none; cursor: pointer; transition: all 0.2s ease;
      font-weight: 700; text-decoration: none;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .btn-action {
      background: var(--primary); color: white;
      padding: 10px 15px; border-radius: 10px; font-size: 13px;
      height: 39px; box-shadow: 0 4px 10px rgba(240, 98, 146, 0.2);
      white-space: nowrap; min-width: 55px;
    }
    .btn-action:hover { background: var(--primary-dark); transform: translateY(-1px); }
    .btn-action:disabled {
      background: #e0e0e0; color: #9e9e9e;
      cursor: not-allowed; transform: none; box-shadow: none;
    }
    .btn-exclude {
      background: #e0e0e0; color: #616161;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.04);
    }
    .btn-exclude:hover { background: #bdbdbd; color: #424242; transform: translateY(-1px); }
    .btn-copy-small {
      background: var(--primary); color: white;
      padding: 0 20px; border-radius: 50px; font-size: 12px;
      height: 38px; margin-left: auto;
      box-shadow: 0 4px 10px rgba(240, 98, 146, 0.2);
    }
    .btn-copy-small:hover { background: var(--primary-dark); transform: translateY(-1px); }
    .btn-header-action {
      height: 32px; padding: 0 14px; font-size: 11px; font-weight: 800;
      border-radius: 50px; display: inline-flex; align-items: center; justify-content: center;
    }
    .btn-clear {
      background: var(--primary-light);
      border: 1px solid rgba(240, 98, 146, 0.2);
      color: var(--primary-dark); letter-spacing: 0.5px;
    }
    .btn-clear:hover { background: #f8bbd0; }
    .btn-link-site {
      background: #ffffff; border: 1px solid var(--border);
      color: var(--primary-dark);
      box-shadow: 0 2px 6px rgba(240, 98, 146, 0.05); margin-right: 6px;
    }
    .btn-link-site:hover { background: var(--primary-light); border-color: var(--primary); }

    .card-footer-options {
      margin-top: 16px; display: flex; align-items: center; flex-wrap: wrap;
      gap: 10px; padding-top: 16px; border-top: 1px dashed var(--border);
    }
    .option-pill {
      background: var(--card-bg); border: 1px solid var(--border);
      padding: 0 14px; height: 38px; border-radius: 50px;
      display: flex; align-items: center; gap: 8px;
      font-size: 12px; font-weight: 600; cursor: pointer;
      box-shadow: 0 2px 6px rgba(240, 98, 146, 0.04); transition: all 0.2s ease;
    }
    .option-pill:hover { border-color: var(--primary); transform: translateY(-1px); }
    .option-pill input { accent-color: var(--primary); width: 15px; height: 15px; margin: 0; }
    .count-badge {
      font-size: 11px; font-weight: 700; color: var(--primary-dark);
      background: var(--primary-light); padding: 3px 10px; border-radius: 20px;
    }

    /* ── 자동 가져오기 섹션 ── */
    .auto-fetch-section {
      margin-bottom: 20px; padding: 18px;
      background: linear-gradient(135deg, #fce4ec 0%, #fff0f3 100%);
      border-radius: 14px; border: 1px solid var(--border);
    }
    .auto-fetch-section .section-label {
      font-size: 13px; font-weight: 700; color: var(--primary-dark);
      margin-bottom: 12px; display: flex; align-items: center; gap: 6px;
    }
    .auto-fetch-row {
      display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
    }
    .auto-fetch-row select {
      flex: 1; min-width: 100px; height: 39px;
      font-size: 13px; font-weight: 600; border-radius: 10px;
    }
    .btn-fetch {
      background: var(--primary-dark); color: white;
      padding: 0 20px; height: 39px; border-radius: 10px;
      font-size: 13px; font-weight: 700; white-space: nowrap;
      box-shadow: 0 4px 12px rgba(216, 27, 96, 0.25);
    }
    .btn-fetch:hover { background: #ad1457; transform: translateY(-1px); }
    .btn-fetch:disabled {
      background: #e0e0e0; color: #9e9e9e;
      cursor: wait; transform: none; box-shadow: none;
    }
    .fetch-status { font-size: 12px; font-weight: 600; margin-top: 10px; min-height: 18px; }
    .fetch-status.success { color: #2e7d32; }
    .fetch-status.error   { color: #c62828; }
    .fetch-status.loading { color: var(--primary-dark); }

    .divider {
      display: flex; align-items: center; gap: 12px;
      margin-bottom: 16px; color: var(--text-sub); font-size: 12px; font-weight: 600;
    }
    .divider::before, .divider::after {
      content: ''; flex: 1; height: 1px; background: var(--border);
    }

    footer {
      padding: 20px 0; text-align: center; font-size: 13px;
      color: var(--text-sub); letter-spacing: 0.3px; font-weight: 500; margin-top: 10px;
    }

    #toast {
      position: fixed; bottom: 30px; left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #333; color: white; padding: 12px 24px;
      border-radius: 50px; font-size: 13px;
      transition: transform 0.3s ease; z-index: 1000;
    }
    #toast.show { transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

<header>
  <h1>블리비의원 시술가격 검색 및 정리</h1>
</header>

<div class="main-wrapper">
  <div class="grid-container">
    <!-- Left -->
    <div class="card">
      <div class="section-title">
        <div class="title-text">원본 데이터 입력</div>
        <div style="display: flex; align-items: center;">
          <a href="https://www.velyb.kr/community/community01.php?tb=event2&etc5=%ED%99%8D%EB%8C%80%EC%A0%90&intGP=&style=&sField=2" target="_blank" class="btn btn-header-action btn-link-site">홍대점 홈페이지</a>
          <button class="btn btn-header-action btn-clear" onclick="clearAll()">CLEAR</button>
        </div>
      </div>

      <!-- ★ 자동 가져오기 -->
      <div class="auto-fetch-section">
        <div class="section-label">⚡ 홈페이지 자동 가져오기</div>
        <div class="auto-fetch-row">
          <select id="branchSelect">
            <option value="홍대점" selected>홍대점</option>
            <option value="강남역점">강남역점</option>
            <option value="건대점">건대점</option>
            <option value="명동점">명동점</option>
            <option value="잠실점">잠실점</option>
            <option value="영등포점">영등포점</option>
            <option value="노원점">노원점</option>
            <option value="구로점">구로점</option>
            <option value="목동점">목동점</option>
            <option value="발산점">발산점</option>
            <option value="용산점">용산점</option>
            <option value="청량리점">청량리점</option>
            <option value="왕십리점">왕십리점</option>
            <option value="분당점">분당점</option>
            <option value="일산점">일산점</option>
            <option value="수원점">수원점</option>
            <option value="부천점">부천점</option>
            <option value="안양점">안양점</option>
            <option value="의정부점">의정부점</option>
            <option value="인천 구월점">인천 구월점</option>
            <option value="인천 부평점">인천 부평점</option>
            <option value="동탄점">동탄점</option>
            <option value="부산 서면점">부산 서면점</option>
            <option value="부산 센텀점">부산 센텀점</option>
            <option value="대구 동성로점">대구 동성로점</option>
            <option value="대전점">대전점</option>
            <option value="광주점">광주점</option>
            <option value="제주점">제주점</option>
          </select>
          <select id="fieldSelect">
            <option value="" selected>전체시술</option>
            <option value="1">기획전</option>
            <option value="2">쁘띠성형</option>
            <option value="3">피부</option>
            <option value="4">리프팅</option>
            <option value="5">부스터</option>
            <option value="6">제모</option>
            <option value="7">비만</option>
          </select>
          <button id="fetchBtn" class="btn btn-fetch" onclick="fetchFromHomepage()">가져오기</button>
        </div>
        <div id="fetchStatus" class="fetch-status"></div>
      </div>

      <div class="divider">또는 직접 붙여넣기</div>

      <textarea id="dataInput" placeholder="블리비 홈페이지에서 시술명+가격데이터를 붙여넣으면 즉시 추출됩니다." oninput="updateData()"></textarea>
      <div style="margin-top: 16px; display: flex; justify-content: flex-end;">
        <span id="inputStatus" class="count-badge">READY</span>
      </div>
    </div>

    <!-- Right -->
    <div class="card">
      <div class="section-title">
        <div class="title-text">정리 결과 및 추출 검색</div>
        <span id="resultCount" class="count-badge">0건</span>
      </div>

      <div class="search-grid">
        <div class="search-inputs-row">
          <div class="label-tag">포함</div>
          <div class="input-group">
            <input type="text" class="search-input" placeholder="키워드 1" onkeyup="handleSearchKey(event)">
            <input type="text" class="search-input" placeholder="키워드 2" onkeyup="handleSearchKey(event)">
            <input type="text" class="search-input" placeholder="키워드 3" onkeyup="handleSearchKey(event)">
          </div>
          <button class="btn btn-action" onclick="performExtraction()">검색</button>
        </div>
        <div class="exclude-inputs-row">
          <div class="label-tag">제외</div>
          <div class="input-group">
            <input type="text" class="exclude-input" placeholder="제외 1" onkeyup="handleSearchKey(event)">
            <input type="text" class="exclude-input" placeholder="제외 2" onkeyup="handleSearchKey(event)">
            <input type="text" class="exclude-input" placeholder="제외 3" onkeyup="handleSearchKey(event)">
          </div>
          <button class="btn btn-action btn-exclude" onclick="performExtraction()">제외</button>
        </div>
      </div>

      <textarea id="resultBox" placeholder="추출된 텍스트 편집 가능
        -원본 텍스트에서 포함할 단어와 제외할 단어를 입력해 원하는 시술만 추려낼 수 있습니다.
        -각 키워드는 검색창에서 콤마(,)로도 구분 가능합니다.
        -홈페이지에 없는 일부 시술(셀바이브, 블리비V주사 등)검색 가능합니다" oninput="handleManualEdit()"></textarea>

      <div class="card-footer-options">
        <label class="option-pill">
          <input type="checkbox" id="keepParens" checked onchange="handleOptionChange()">
          <span>괄호 속 텍스트 유지</span>
        </label>
        <label class="option-pill">
          <input type="checkbox" id="vatLine" checked onchange="handleOptionChange()">
          <span>부가세 안내 포함</span>
        </label>
        <button class="btn btn-copy-small" onclick="copyResult()">텍스트 복사</button>
      </div>
    </div>
  </div>

  <footer>&copy; 2026. Designed & Developed by EUNBIN GA</footer>
</div>

<div id="toast">복사 완료!</div>

<script>
  // ╔═══════════════════════════════════════════════════════════╗
  // ║  ★★★ 이 한 줄만 본인 Vercel 주소로 바꾸세요 ★★★          ║
  // ║  예: 'https://my-charting-app.vercel.app'               ║
  // ╚═══════════════════════════════════════════════════════════╝
  const API_BASE = 'https://autochart-two.vercel.app';

  // ── 홈페이지에 없는 시술 (항상 유지) ──
  const CUSTOM_DATABASE = [
    { name: "셀바이브(프리미엄LDM) 6분 1회", price: "29,000원" },
    { name: "셀바이브(프리미엄LDM) 6분 5회", price: "139,000원" },
    { name: "셀바이브(프리미엄LDM) 12분 1회", price: "55,000원" },
    { name: "셀바이브(프리미엄LDM) 12분 5회", price: "250,000원" },
    { name: "셀바이브(프리미엄LDM) 24분 1회", price: "105,000원" },
    { name: "셀바이브(프리미엄LDM) 24분 5회", price: "550,000원" },
    { name: "엔바이론 이온자임(고농도 비타민 침투) 체험가", price: "69,000원" },
    { name: "엔바이론 이온자임(고농도 비타민 침투)", price: "79,000원" },
    { name: "엔바이론 이온자임(고농도 비타민 침투) 5회", price: "390,000원" },
    { name: "서브시전 얼굴전체", price: "150,000원" },
    { name: "서브시전 1부위", price: "100,000원" },
    { name: "쥬베룩스킨 2cc 눈밑 케뉼라시술", price: "220,000원" },
    { name: "올리디아스킨 2cc 눈밑 케뉼라시술", price: "250,000원" },
    { name: "블리비V주사 1회", price: "100,000원" },
    { name: "블리비V주사 3회", price: "250,000원" },
    { name: "블리비V주사 3개월 책임제", price: "600,000원" },
    { name: "코 조각주사 1회", price: "50,000원" },
    { name: "코 조각주사 3회", price: "99,000원" },
    { name: "주름필러 1cc", price: "350,000원" }
  ];

  let treatmentData = [];
  let fetchedData = [];
  let isEditingOutput = false;

  // ── 유틸리티 ──
  function cleanName(name, keepParens) {
    let n = name;
    if (!keepParens) {
      n = n.replace(/\([^)]*\)/g, "");
      n = n.replace(/\[[^\]]*\]/g, "");
    }
    return n.replace(/\s+/g, " ").trim();
  }

  function extractPrice(text) {
    if (!text) return null;
    const match = text.match(/(\d{1,3}(,\d{3})*|\d+)원/);
    return match ? match[0] : null;
  }

  // ═══════════════════════════════════════════════════
  // ★ 홈페이지 자동 가져오기
  // ═══════════════════════════════════════════════════
  async function fetchFromHomepage() {
    const branch = document.getElementById('branchSelect').value;
    const sField = document.getElementById('fieldSelect').value;
    const btn = document.getElementById('fetchBtn');
    const status = document.getElementById('fetchStatus');

    btn.disabled = true;
    btn.textContent = '가져오는 중...';
    status.className = 'fetch-status loading';
    status.textContent = branch + ' 데이터를 가져오고 있습니다...';

    try {
      let url = API_BASE + '/api/scrape-velyb?etc5=' + encodeURIComponent(branch);
      if (sField) url += '&sField=' + encodeURIComponent(sField);

      const res = await fetch(url);
      const data = await res.json();

      if (data.error) {
        status.className = 'fetch-status error';
        status.textContent = '오류: ' + data.error;
        return;
      }

      fetchedData = data.treatments || [];
      treatmentData = fetchedData.map(function(t) { return { name: t.name, price: t.price }; });

      // 왼쪽 textarea에 미리보기
      document.getElementById('dataInput').value =
        fetchedData.map(function(t) { return t.name + ' ' + t.price; }).join('\n');

      document.getElementById('inputStatus').innerText = fetchedData.length + '건 가져옴';
      status.className = 'fetch-status success';
      status.textContent = branch + ' — ' + fetchedData.length + '건 가져오기 완료';

      isEditingOutput = false;
      var hasKw = Array.from(document.querySelectorAll('.search-input, .exclude-input'))
                       .some(function(inp) { return inp.value.trim().length > 0; });
      if (hasKw) { performExtraction(); } else { renderResult(treatmentData); }

    } catch (e) {
      status.className = 'fetch-status error';
      status.textContent = '네트워크 오류: ' + e.message;
    } finally {
      btn.disabled = false;
      btn.textContent = '가져오기';
    }
  }

  // ── 기존 기능들 ──
  function handleOptionChange() {
    isEditingOutput = false;
    var hasKw = Array.from(document.querySelectorAll('.search-input, .exclude-input'))
                     .some(function(inp) { return inp.value.trim().length > 0; });
    if (hasKw) { performExtraction(); } else { updateData(); }
  }

  function handleManualEdit() {
    isEditingOutput = true;
    document.getElementById('resultCount').innerText = "편집 중";
  }

  function handleSearchKey(e) { if (e.keyCode === 13) performExtraction(); }

  function updateData() {
    var rawText = document.getElementById('dataInput').value.trim();
    var parsedData = [];
    if (rawText) {
      var lines = rawText.split('\n').map(function(l){return l.trim();}).filter(function(l){return l.length>0;});
      for (var i = 0; i < lines.length; i++) {
        var cur = lines[i];
        var p1 = extractPrice(cur);
        if (p1) {
          var nm = cur.split(p1)[0].trim();
          if (nm && nm.length > 1) { parsedData.push({ name: nm, price: p1 }); continue; }
        }
        var nxt = lines[i + 1] || "";
        var p2 = extractPrice(nxt);
        if (p2 && !/%|할인|이벤트/.test(cur) && !/\d원/.test(cur)) {
          parsedData.push({ name: cur, price: p2 }); i++;
        }
      }
    }
    treatmentData = parsedData;
    document.getElementById('inputStatus').innerText = treatmentData.length + '건 분석됨';

    if (!isEditingOutput) {
      var hasKw = Array.from(document.querySelectorAll('.search-input, .exclude-input'))
                       .some(function(inp){return inp.value.trim().length>0;});
      if (hasKw) { performExtraction(); } else { renderResult(treatmentData); }
    }
  }

  function renderResult(dataList) {
    var useVat = document.getElementById('vatLine').checked;
    var keepParens = document.getElementById('keepParens').checked;
    var finalTxt = dataList.map(function(item) {
      return cleanName(item.name, keepParens) + ' ' + item.price;
    }).filter(function(l){return l.trim()!=="";}).join('\n');
    if (useVat && dataList.length > 0) {
      finalTxt += (finalTxt ? "\n\n" : "") + "부가세 10% 별도입니다 😊";
    }
    document.getElementById('resultBox').value = finalTxt;
    document.getElementById('resultCount').innerText = dataList.length + '건';
  }

  function performExtraction() {
    var searchInputs = document.querySelectorAll('.search-input');
    var excludeInputs = document.querySelectorAll('.exclude-input');
    isEditingOutput = false;

    var allKeywords = [];
    searchInputs.forEach(function(input) {
      var val = input.value.trim();
      if (val) {
        val.split(',').forEach(function(k) {
          k = k.replace(/\s+/g,"").toLowerCase();
          if (k.length > 0) allKeywords.push(k);
        });
      }
    });

    var excludeKeywords = [];
    excludeInputs.forEach(function(input) {
      var val = input.value.trim();
      if (val) {
        val.split(',').forEach(function(k) {
          k = k.replace(/\s+/g,"").toLowerCase();
          if (k.length > 0) excludeKeywords.push(k);
        });
      }
    });

    // ★ CUSTOM_DATABASE는 항상 합침 (홈페이지에 없는 시술)
    var mergedMap = new Map();
    CUSTOM_DATABASE.forEach(function(item) {
      mergedMap.set(item.name.replace(/\s+/g,"").toLowerCase(), item);
    });
    treatmentData.forEach(function(item) {
      mergedMap.set(item.name.replace(/\s+/g,"").toLowerCase(), item);
    });
    var sourceData = Array.from(mergedMap.values());

    if (allKeywords.length === 0 && excludeKeywords.length === 0) {
      renderResult(treatmentData.length > 0 ? treatmentData : []);
      return;
    }

    var filtered = sourceData;
    if (allKeywords.length > 0) {
      filtered = filtered.filter(function(item) {
        var cn = item.name.replace(/\s+/g,"").toLowerCase();
        return allKeywords.some(function(kw){return cn.includes(kw);});
      });
    }
    if (excludeKeywords.length > 0) {
      filtered = filtered.filter(function(item) {
        var cn = item.name.replace(/\s+/g,"").toLowerCase();
        return !excludeKeywords.some(function(ex){return cn.includes(ex);});
      });
    }
    renderResult(filtered);
  }

  function clearAll() {
    document.getElementById('dataInput').value = "";
    document.getElementById('resultBox').value = "";
    document.querySelectorAll('.search-input').forEach(function(i){i.value="";});
    document.querySelectorAll('.exclude-input').forEach(function(i){i.value="";});
    treatmentData = []; fetchedData = []; isEditingOutput = false;
    document.getElementById('inputStatus').innerText = "READY";
    document.getElementById('resultCount').innerText = "0건";
    document.getElementById('fetchStatus').textContent = "";
    document.getElementById('fetchStatus').className = "fetch-status";
  }

  function copyResult() {
    var text = document.getElementById('resultBox').value;
    if (!text) return;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(showToast).catch(function(){fallbackCopy(text);});
    } else { fallbackCopy(text); }
  }
  function fallbackCopy(text) {
    var t = document.createElement("textarea"); t.value = text;
    document.body.appendChild(t); t.select();
    try { document.execCommand('copy'); showToast(); } catch(e){}
    document.body.removeChild(t);
  }
  function showToast() {
    var toast = document.getElementById('toast');
    toast.classList.add('show');
    setTimeout(function(){toast.classList.remove('show');}, 2000);
  }
</script>
</body>
</html>
