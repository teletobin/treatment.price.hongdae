<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>블리비 홍대점 시술 검색</title>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
  <style>
    :root {
      --primary: #f06292;
      --primary-dark: #d81b60;
      --primary-light: #fce4ec;
      --text: #424242;
      --text-sub: #757575;
      --border: rgba(240, 98, 146, 0.2);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      font-family: "Pretendard", "Noto Sans KR", sans-serif !important;
      color: var(--text);
    }

    body {
      margin: 0; padding: 0;
      background: #fff;
      min-height: 100vh;
      display: flex; flex-direction: column;
    }

    header {
      padding: 14px 20px;
      text-align: center;
      background: var(--primary-light);
      border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 100;
    }
    header h1 {
      margin: 0; font-size: 18px; font-weight: 700;
      letter-spacing: -0.5px;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
      padding: 24px 20px;
      width: 100%;
      flex: 1;
      display: flex; flex-direction: column;
    }

    /* ── 검색 영역 ── */
    .search-section {
      margin-bottom: 16px;
    }
    .search-box {
      position: relative;
      margin-bottom: 10px;
    }
    .search-box input {
      width: 100%;
      padding: 14px 18px 14px 44px;
      border-radius: 50px;
      border: 2px solid var(--border);
      font-size: 15px; font-weight: 600;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      background: #fff;
    }
    .search-box input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(240, 98, 146, 0.08);
    }
    .search-box input::placeholder { color: #bbb; font-weight: 500; }
    .search-icon {
      position: absolute; left: 16px; top: 50%;
      transform: translateY(-50%);
      width: 18px; height: 18px;
      color: #bbb; pointer-events: none;
    }

    .exclude-section {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 12px;
    }
    .exclude-label {
      font-size: 12px; font-weight: 700; color: var(--text-sub);
      white-space: nowrap; width: 32px; text-align: center;
    }
    .exclude-inputs {
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 6px; flex: 1;
    }
    .exclude-inputs input {
      width: 100%; padding: 8px 12px;
      border-radius: 50px;
      border: 1px solid #e0e0e0;
      font-size: 12px; font-weight: 500;
      outline: none; background: #fafafa;
    }
    .exclude-inputs input:focus {
      border-color: #bbb; background: #fff;
    }

    /* ── 옵션 + 상태 바 ── */
    .options-bar {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 14px; flex-wrap: wrap; gap: 8px;
    }
    .options-left {
      display: flex; align-items: center; gap: 10px;
    }
    .option-toggle {
      display: flex; align-items: center; gap: 4px;
      font-size: 11px; font-weight: 600; color: var(--text-sub);
      cursor: pointer; user-select: none;
    }
    .option-toggle input {
      accent-color: var(--primary);
      width: 13px; height: 13px; margin: 0;
    }
    .options-right {
      display: flex; align-items: center; gap: 8px;
    }
    .count-badge {
      font-size: 11px; font-weight: 700; color: var(--primary-dark);
      background: var(--primary-light);
      padding: 2px 10px; border-radius: 20px;
    }
    .sync-info {
      font-size: 11px; color: #bbb; font-weight: 500;
    }
    .btn-sync {
      border: none; cursor: pointer;
      background: none; color: var(--primary-dark);
      font-size: 11px; font-weight: 700;
      text-decoration: underline; padding: 0;
    }
    .btn-sync:hover { color: #ad1457; }
    .btn-sync:disabled { color: #ccc; cursor: wait; }

    /* ── 결과 텍스트 영역 ── */
    .result-area {
      flex: 1; display: flex; flex-direction: column;
      min-height: 300px;
    }
    .result-box {
      flex: 1; width: 100%;
      padding: 18px;
      border-radius: 14px;
      border: 1px solid var(--border);
      font-size: 14px; line-height: 1.8;
      resize: none; outline: none;
      background: #fffafa;
      color: var(--text);
      transition: border-color 0.2s;
    }
    .result-box:focus {
      border-color: var(--primary);
      background: #fff;
    }
    .result-placeholder {
      flex: 1; display: flex; align-items: center; justify-content: center;
      color: #ccc; font-size: 14px; font-weight: 500;
      min-height: 300px;
      border: 1px dashed var(--border);
      border-radius: 14px;
    }

    /* ── 하단 복사 바 ── */
    .copy-bar {
      margin-top: 14px;
      display: flex; align-items: center; justify-content: flex-end;
      gap: 12px;
    }
    .copy-bar.hidden { display: none; }
    .btn-copy {
      border: none; cursor: pointer;
      background: var(--primary-dark); color: white;
      padding: 10px 28px; border-radius: 50px;
      font-size: 13px; font-weight: 700;
      box-shadow: 0 4px 12px rgba(216, 27, 96, 0.2);
      transition: all 0.2s;
    }
    .btn-copy:hover { background: #ad1457; transform: translateY(-1px); }
    .copy-info {
      font-size: 12px; color: var(--text-sub); font-weight: 500;
    }

    /* ── 로딩 ── */
    .loading-box {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      min-height: 300px; color: var(--primary-dark);
      font-size: 14px; font-weight: 600; gap: 12px;
    }
    .spinner {
      width: 24px; height: 24px;
      border: 3px solid var(--primary-light);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── 토스트 ── */
    #toast {
      position: fixed; bottom: 30px; left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #333; color: white; padding: 10px 24px;
      border-radius: 50px; font-size: 13px;
      transition: transform 0.3s ease; z-index: 1000;
    }
    #toast.show { transform: translateX(-50%) translateY(0); }

    footer {
      padding: 16px 0; text-align: center;
      font-size: 12px; color: #ccc; font-weight: 500;
    }
  </style>
</head>
<body>

<header>
  <h1>블리비 홍대점 시술 검색</h1>
</header>

<div class="container">
  <!-- 검색 -->
  <div class="search-section">
    <div class="search-box">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="searchInput" placeholder="시술명 검색 (예: 슈링크 한정가, 보톡스)" oninput="doSearch()" autofocus>
    </div>
    <div class="exclude-section">
      <div class="exclude-label">제외</div>
      <div class="exclude-inputs">
        <input type="text" class="exclude-field" placeholder="제외 1" oninput="doSearch()">
        <input type="text" class="exclude-field" placeholder="제외 2" oninput="doSearch()">
        <input type="text" class="exclude-field" placeholder="제외 3" oninput="doSearch()">
      </div>
    </div>
  </div>

  <!-- 옵션 + 상태 -->
  <div class="options-bar">
    <div class="options-left">
      <label class="option-toggle">
        <input type="checkbox" id="keepParens" checked onchange="doSearch()">
        <span>괄호 유지</span>
      </label>
      <label class="option-toggle">
        <input type="checkbox" id="vatLine" checked onchange="doSearch()">
        <span>부가세 안내</span>
      </label>
    </div>
    <div class="options-right">
      <span id="resultCount" class="count-badge">0건</span>
      <span id="syncInfo" class="sync-info"></span>
      <button id="syncBtn" class="btn-sync" onclick="syncFromHomepage()">업데이트</button>
    </div>
  </div>

  <!-- 결과 -->
  <div id="resultArea" class="result-area">
    <div class="result-placeholder">검색어를 입력하세요</div>
  </div>

  <!-- 복사 -->
  <div id="copyBar" class="copy-bar hidden">
    <span class="copy-info" id="copyInfo"></span>
    <button class="btn-copy" onclick="copyResults()">텍스트 복사</button>
  </div>
</div>

<footer>&copy; 2026. Designed & Developed by EUNBIN GA</footer>
<div id="toast">복사 완료!</div>

<script>
  var API_BASE = 'https://autochart-two.vercel.app';
  var DEFAULT_BRANCH = '홍대점';
  var CACHE_KEY = 'velyb_hongdae_data';
  var CACHE_TIME_KEY = 'velyb_hongdae_time';

  var CUSTOM_DATABASE = [
    { name: "셀바이브(프리미엄LDM) 6분 1회", price: "29,000원" },
    { name: "셀바이브(프리미엄LDM) 6분 5회", price: "139,000원" },
    { name: "셀바이브(프리미엄LDM) 12분 1회", price: "55,000원" },
    { name: "셀바이브(프리미엄LDM) 12분 5회", price: "250,000원" },
    { name: "셀바이브(프리미엄LDM) 24분 1회", price: "105,000원" },
    { name: "셀바이브(프리미엄LDM) 24분 5회", price: "550,000원" },
    { name: "엔바이론 이온자임(고농도 비타민 침투) 체험가", price: "69,000원" },
    { name: "엔바이론 이온자임(고농도 비타민 침투)", price: "79,000원" },
    { name: "엔바이론 이온자임(고농도 비타민 침투) 5회", price: "390,000원" },
    { name: "서브시전 얼굴전체", price: "150,000원" },
    { name: "서브시전 1부위", price: "100,000원" },
    { name: "쥬베룩스킨 2cc 눈밑 케뉼라시술", price: "220,000원" },
    { name: "올리디아스킨 2cc 눈밑 케뉼라시술", price: "250,000원" },
    { name: "블리비V주사 1회", price: "100,000원" },
    { name: "블리비V주사 3회", price: "250,000원" },
    { name: "블리비V주사 3개월 책임제", price: "600,000원" },
    { name: "코 조각주사 1회", price: "50,000원" },
    { name: "코 조각주사 3회", price: "99,000원" },
    { name: "주름필러 1cc", price: "350,000원" }
  ];

  var allTreatments = [];

  // ══════════════════════════════════════
  // 토큰 기반 매칭 (자동차팅 로직 참고)
  // ══════════════════════════════════════

  // 문자열 → 토큰 배열: 한글/영문/숫자 단위로 쪼갬
  function tokenize(str) {
    return str.toLowerCase().replace(/[^\uAC00-\uD7AF\u3131-\u318Ea-z0-9]/gi, ' ')
              .split(/\s+/).filter(function(t) { return t.length > 0; });
  }

  // 두 토큰이 매칭되는지 판정
  // - 숫자 토큰: 정확히 같아야 함 ("100" ≠ "1000")
  // - 2자 이하: 정확히 같아야 함 ("FX" = "fx", but "모" ≠ "인모드")
  // - 3자 이상: 부분 포함이면 OK ("슈링크" ⊂ "슈링크유니버스")
  function tokensMatch(query, name) {
    var q = query.toLowerCase();
    var n = name.toLowerCase();
    if (/^\d+$/.test(q) || /^\d+$/.test(n)) return q === n;
    if (q.length <= 2 || n.length <= 2) return q === n;
    var shorter = q.length <= n.length ? q : n;
    var longer  = q.length <= n.length ? n : q;
    return longer.indexOf(shorter) !== -1;
  }

  // 시술 하나가 검색 토큰들에 매칭되는지 + 점수 계산
  // 모든 검색 토큰이 시술명 토큰 중 하나 이상과 매칭되어야 함 (AND)
  function scoreItem(queryTokens, nameTokens) {
    var matchedChars = 0;
    var matchedCount = 0;

    for (var i = 0; i < queryTokens.length; i++) {
      var q = queryTokens[i];
      var found = false;
      for (var j = 0; j < nameTokens.length; j++) {
        if (tokensMatch(q, nameTokens[j])) {
          matchedChars += Math.min(q.length, nameTokens[j].length);
          matchedCount++;
          found = true;
          break;
        }
      }
      if (!found) return null; // 하나라도 못 찾으면 탈락
    }

    var coverage  = matchedCount / queryTokens.length;
    var precision = matchedCount / nameTokens.length;
    var score = coverage * 0.7 + precision * 0.3;

    return { matchedChars: matchedChars, score: score };
  }

  // ══════════════════════════════════════
  // 초기화
  // ══════════════════════════════════════
  function init() {
    var cached = localStorage.getItem(CACHE_KEY);
    if (cached) {
      try {
        mergeTreatments(JSON.parse(cached));
        updateSyncInfo();
      } catch(e) {
        syncFromHomepage();
        return;
      }
    } else {
      syncFromHomepage();
    }
  }

  function mergeTreatments(homepageData) {
    var map = new Map();
    CUSTOM_DATABASE.forEach(function(item) {
      map.set(item.name.replace(/\s+/g,"").toLowerCase(), item);
    });
    homepageData.forEach(function(item) {
      map.set(item.name.replace(/\s+/g,"").toLowerCase(), item);
    });
    allTreatments = Array.from(map.values());
    // 토큰 미리 계산
    allTreatments.forEach(function(item) {
      item._tokens = tokenize(item.name);
    });
  }

  // ══════════════════════════════════════
  // 홈페이지 연동
  // ══════════════════════════════════════
  async function syncFromHomepage() {
    var btn = document.getElementById('syncBtn');
    var area = document.getElementById('resultArea');

    btn.disabled = true;
    btn.textContent = '연동 중...';

    if (allTreatments.length === 0) {
      area.innerHTML = '<div class="loading-box"><div class="spinner"></div>홍대점 시술 데이터를 가져오고 있습니다...</div>';
    }

    try {
      var url = API_BASE + '/api/scrape-velyb?etc5=' + encodeURIComponent(DEFAULT_BRANCH);
      var res = await fetch(url);
      var data = await res.json();

      if (data.error) {
        if (allTreatments.length === 0) {
          area.innerHTML = '<div class="result-placeholder">데이터를 가져오지 못했습니다. 다시 시도해주세요.</div>';
        }
        return;
      }

      var treatments = data.treatments || [];
      localStorage.setItem(CACHE_KEY, JSON.stringify(treatments));
      localStorage.setItem(CACHE_TIME_KEY, new Date().toISOString());

      mergeTreatments(treatments);
      updateSyncInfo();
      doSearch();

    } catch (e) {
      if (allTreatments.length === 0) {
        area.innerHTML = '<div class="result-placeholder">네트워크 오류. 다시 시도해주세요.</div>';
      }
    } finally {
      btn.disabled = false;
      btn.textContent = '업데이트';
    }
  }

  function updateSyncInfo() {
    var info = document.getElementById('syncInfo');
    var timeStr = localStorage.getItem(CACHE_TIME_KEY);
    if (!timeStr) { info.textContent = ''; return; }

    var diff = Date.now() - new Date(timeStr).getTime();
    var min = Math.floor(diff / 60000);
    var hr  = Math.floor(diff / 3600000);
    var day = Math.floor(diff / 86400000);

    var ago = min < 1 ? '방금' : min < 60 ? min + '분 전' : hr < 24 ? hr + '시간 전' : day + '일 전';
    info.textContent = '연동: ' + ago;
    info.style.color = day >= 14 ? '#e65100' : '#bbb';
    if (day >= 14) info.textContent += ' ⚠️';
  }

  // ══════════════════════════════════════
  // 검색
  // ══════════════════════════════════════
  function doSearch() {
    var raw = document.getElementById('searchInput').value.trim();
    var keepParens = document.getElementById('keepParens').checked;
    var useVat = document.getElementById('vatLine').checked;
    var area = document.getElementById('resultArea');
    var copyBar = document.getElementById('copyBar');

    // 제외 키워드 수집
    var excludeTokens = [];
    document.querySelectorAll('.exclude-field').forEach(function(input) {
      var val = input.value.trim();
      if (val) {
        val.split(',').forEach(function(k) {
          k = k.replace(/\s+/g,"").toLowerCase();
          if (k) excludeTokens.push(k);
        });
      }
    });

    if (!raw) {
      document.getElementById('resultCount').textContent = allTreatments.length + '건 보유';
      area.innerHTML = '<div class="result-placeholder">검색어를 입력하세요</div>';
      copyBar.classList.add('hidden');
      return;
    }

    // 콤마로 구분 → OR 그룹
    var orGroups = raw.split(',').map(function(g) { return g.trim(); }).filter(function(g) { return g.length > 0; });

    // 각 OR 그룹을 토큰화 → 그룹 내 토큰은 AND 조건
    var matched = [];

    allTreatments.forEach(function(item) {
      var nameTokens = item._tokens;
      if (!nameTokens || nameTokens.length === 0) return;

      // 제외 체크
      if (excludeTokens.length > 0) {
        var nameLower = item.name.replace(/\s+/g,"").toLowerCase();
        var excluded = excludeTokens.some(function(ex) { return nameLower.indexOf(ex) !== -1; });
        if (excluded) return;
      }

      var bestScore = null;

      for (var g = 0; g < orGroups.length; g++) {
        var qTokens = tokenize(orGroups[g]);
        if (qTokens.length === 0) continue;

        var result = scoreItem(qTokens, nameTokens);
        if (result && (!bestScore || result.matchedChars > bestScore.matchedChars ||
            (result.matchedChars === bestScore.matchedChars && result.score > bestScore.score))) {
          bestScore = result;
        }
      }

      if (bestScore) {
        matched.push({ item: item, matchedChars: bestScore.matchedChars, score: bestScore.score });
      }
    });

    // 매칭 글자수 → 점수 순 정렬
    matched.sort(function(a, b) {
      return b.matchedChars - a.matchedChars || b.score - a.score;
    });

    document.getElementById('resultCount').textContent = matched.length + '건';

    if (matched.length === 0) {
      area.innerHTML = '<div class="result-placeholder">검색 결과가 없습니다</div>';
      copyBar.classList.add('hidden');
      return;
    }

    // 결과 텍스트 생성
    var lines = matched.map(function(m) {
      var displayName = cleanName(m.item.name, keepParens);
      return displayName + ' ' + m.item.price;
    });

    var text = lines.join('\n');
    if (useVat) {
      text += '\n\n부가세 10% 별도입니다 😊';
    }

    area.innerHTML = '<textarea class="result-box" id="resultBox">' + escapeHtml(text) + '</textarea>';

    document.getElementById('copyInfo').textContent = matched.length + '개 시술';
    copyBar.classList.remove('hidden');
  }

  // ── 유틸 ──
  function cleanName(name, keepParens) {
    var n = name;
    if (!keepParens) {
      n = n.replace(/\([^)]*\)/g, "");
      n = n.replace(/\[[^\]]*\]/g, "");
    }
    return n.replace(/\s+/g, " ").trim();
  }

  function escapeHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function copyResults() {
    var box = document.getElementById('resultBox');
    if (!box) return;
    var text = box.value;
    if (!text) return;

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(showToast).catch(function(){ fallbackCopy(text); });
    } else {
      fallbackCopy(text);
    }
  }

  function fallbackCopy(text) {
    var t = document.createElement("textarea"); t.value = text;
    document.body.appendChild(t); t.select();
    try { document.execCommand('copy'); showToast(); } catch(e){}
    document.body.removeChild(t);
  }

  function showToast() {
    var toast = document.getElementById('toast');
    toast.classList.add('show');
    setTimeout(function(){ toast.classList.remove('show'); }, 2000);
  }

  init();
</script>
</body>
</html>
