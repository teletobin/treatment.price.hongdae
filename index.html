<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>시술가격 검색 정리</title>

  <!-- Pretendard Font -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />

  <style>
    :root {
      color-scheme: light;
      --bg: #ffffff; 
      --primary: #f06292;
      --primary-dark: #d81b60; 
      --primary-light: #fce4ec;
      --text: #333333;
      --text-sub: #9e9e9e;
      --card-bg: #ffffff;
      --border: rgba(240, 98, 146, 0.2);
      --shadow: 0 4px 20px rgba(0, 0, 0, 0.05); 
      --radius: 20px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      font-family: "Pretendard", "Noto Sans KR", sans-serif !important;
      color: var(--text);
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 15px 20px;
      text-align: center;
      background: var(--primary-light); 
      border-bottom: 2px solid rgba(240, 98, 146, 0.1);
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 15px rgba(240, 98, 146, 0.05);
    }

    header h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 700;
      color: #333333;
      letter-spacing: -0.7px;
    }

    .main-wrapper {
      flex: 1;
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px;
      width: 100%;
    }

    .grid-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      width: 100%;
    }

    @media (max-width: 900px) {
      .grid-container {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      border: 1px solid var(--border);
      min-height: 650px;
    }

    .section-title {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .title-text {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .title-text::before {
      content: '';
      display: inline-block;
      width: 4px;
      height: 14px;
      background: var(--primary);
      border-radius: 2px;
    }

    textarea {
      width: 100%;
      flex: 1;
      padding: 18px;
      border-radius: 14px;
      border: 1px solid var(--border);
      font-size: 14px;
      line-height: 1.7;
      resize: none;
      outline: none;
      background: #fffafa;
      transition: all 0.2s;
    }

    textarea:focus {
      border-color: var(--primary);
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(240, 98, 146, 0.05);
    }

    .search-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 16px;
    }

    .search-inputs-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      font-size: 13px;
      font-weight: 600;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      border-color: var(--primary);
    }

    .btn {
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: 700;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .btn-search {
      background: var(--primary);
      color: white;
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      font-size: 14px;
      box-shadow: 0 4px 10px rgba(240, 98, 146, 0.2);
    }

    .btn-search:hover {
      background: var(--primary-dark);
      transform: translateY(-1px);
    }

    .btn-copy-small {
      background: var(--primary);
      color: white;
      padding: 8px 16px;
      border-radius: 50px;
      font-size: 12px;
      margin-left: auto;
      box-shadow: 0 4px 10px rgba(240, 98, 146, 0.2);
    }

    .btn-copy-small:hover {
      background: var(--primary-dark);
      transform: translateY(-1px);
    }

    .btn-clear {
      background: var(--primary-light);
      border: 1px solid rgba(240, 98, 146, 0.2);
      color: var(--primary-dark);
      font-size: 11px;
      font-weight: 800;
      padding: 5px 12px;
      border-radius: 50px;
      letter-spacing: 0.5px;
    }

    .btn-clear:hover {
      background: #f8bbd0;
    }

    .btn-link-site {
      background: #ffffff;
      border: 1px solid var(--border);
      color: var(--primary-dark);
      font-size: 11px;
      font-weight: 800;
      padding: 5px 12px;
      border-radius: 50px;
      margin-right: 6px;
      box-shadow: 0 2px 6px rgba(240, 98, 146, 0.05);
    }

    .btn-link-site:hover {
      background: var(--primary-light);
      border-color: var(--primary);
    }

    .card-footer-options {
      margin-top: 16px;
      display: flex;
      align-items: center; 
      flex-wrap: wrap;
      gap: 10px;
      padding-top: 16px;
      border-top: 1px dashed var(--border);
    }

    .option-pill {
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 50px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(240, 98, 146, 0.04);
      transition: all 0.2s ease;
    }

    .option-pill:hover {
      border-color: var(--primary);
      transform: translateY(-1px);
    }

    .option-pill input {
      accent-color: var(--primary);
      width: 15px;
      height: 15px;
      margin: 0;
    }

    .count-badge {
      font-size: 11px;
      font-weight: 700;
      color: var(--primary-dark);
      background: var(--primary-light);
      padding: 3px 10px;
      border-radius: 20px;
    }

    footer {
      padding: 20px 0;
      text-align: center;
      font-size: 13px;
      color: var(--text-sub);
      letter-spacing: 0.3px;
      font-weight: 500;
      margin-top: 10px;
    }

    #toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #333;
      color: white;
      padding: 12px 24px;
      border-radius: 50px;
      font-size: 13px;
      transition: transform 0.3s ease;
      z-index: 1000;
    }

    #toast.show { transform: translateX(-50%) translateY(0); }
  </style>
</head>

<body>

<header>
  <h1>블리비의원 시술가격 검색 및 정리</h1>
</header>

<div class="main-wrapper">
  
  <div class="grid-container">
    
    <!-- Left: Data Input -->
    <div class="card">
      <div class="section-title">
        <div class="title-text">원본 데이터 입력</div>
        <div>
          <a href="https://www.velyb.kr/community/community01.php?tb=event2&etc5=%ED%99%8D%EB%8C%80%EC%A0%90&intGP=&style=&sField=2" target="_blank" class="btn btn-link-site">홍대점 홈페이지</a>
          <button class="btn btn-clear" onclick="clearAll()">CLEAR</button>
        </div>
      </div>

      <textarea id="dataInput" placeholder="블리비 홈페이지에서 시술명+가격데이터를 붙여넣으면 즉시 추출됩니다." oninput="updateData()"></textarea>
      
      <div style="margin-top: 16px; display: flex; justify-content: flex-end;">
          <span id="inputStatus" class="count-badge">READY</span>
      </div>
    </div>

    <!-- Right: Search and Result Editing -->
    <div class="card">
      <div class="section-title">
        <div class="title-text">정리 결과 및 추출 검색</div>
        <span id="resultCount" class="count-badge">0건</span>
      </div>

      <div class="search-grid">
        <div class="search-inputs-row">
          <input type="text" class="search-input" placeholder="키워드 1" onkeyup="handleSearchKey(event)">
          <input type="text" class="search-input" placeholder="키워드 2" onkeyup="handleSearchKey(event)">
          <input type="text" class="search-input" placeholder="키워드 3" onkeyup="handleSearchKey(event)">
        </div>
        <button class="btn btn-search" onclick="performExtraction()">키워드 추출</button>
      </div>

      <textarea id="resultBox" placeholder="추출된 텍스트는 편집 가능합니다." oninput="handleManualEdit()"></textarea>

      <div class="card-footer-options">
        <label class="option-pill">
          <input type="checkbox" id="keepParens" checked onchange="handleOptionChange()">
          <span>괄호 속 텍스트 유지</span>
        </label>
        <label class="option-pill">
          <input type="checkbox" id="vatLine" checked onchange="handleOptionChange()">
          <span>부가세 안내 포함</span>
        </label>
        
        <button class="btn btn-copy-small" onclick="copyResult()">텍스트 복사</button>
      </div>
    </div>
  </div>

  <footer>
    &copy; 2026. Designed & Developed by EUNBIN GA
  </footer>
</div>

<div id="toast">복사 완료!</div>

<script>
  let treatmentData = [];
  let isEditingOutput = false;

  function cleanName(name, keepParens) {
    let n = name;
    if (!keepParens) {
      n = n.replace(/\([^)]*\)/g, ""); 
      n = n.replace(/\[[^\]]*\]/g, ""); 
    }
    return n.replace(/\s+/g, " ").trim();
  }

  function extractPrice(text) {
    if (!text) return null;
    const match = text.match(/(\d{1,3}(,\d{3})*|\d+)원/);
    return match ? match[0] : null;
  }

  function handleOptionChange() {
    isEditingOutput = false; 
    updateData(); 
  }

  function handleManualEdit() {
    isEditingOutput = true;
    document.getElementById('resultCount').innerText = "편집 중";
  }

  function handleSearchKey(e) {
    if(e.keyCode === 13) {
      performExtraction();
    }
  }

  function updateData() {
    const rawText = document.getElementById('dataInput').value.trim();
    const keepParens = document.getElementById('keepParens').checked;
    
    if (!rawText) {
      treatmentData = [];
      document.getElementById('resultBox').value = "";
      document.getElementById('inputStatus').innerText = "READY";
      document.getElementById('resultCount').innerText = "0건";
      return;
    }

    const lines = rawText.split('\n').map(l => l.trim()).filter(l => l.length > 0);
    treatmentData = [];
    
    for (let i = 0; i < lines.length; i++) {
      const currentLine = lines[i];
      const priceInCurrent = extractPrice(currentLine);
      
      if (priceInCurrent) {
        const namePart = currentLine.split(priceInCurrent)[0].trim();
        if (namePart && namePart.length > 1) {
          treatmentData.push({
            name: cleanName(namePart, keepParens),
            price: priceInCurrent
          });
          continue;
        }
      }

      const nextLine = lines[i + 1] || "";
      const priceInNext = extractPrice(nextLine);
      if (priceInNext && !/%|할인|이벤트/.test(currentLine) && !/\d원/.test(currentLine)) {
        treatmentData.push({
          name: cleanName(currentLine, keepParens),
          price: priceInNext
        });
        i++;
      }
    }

    document.getElementById('inputStatus').innerText = `${treatmentData.length}건 분석됨`;
    
    const searchInputs = document.querySelectorAll('.search-input');
    const hasAnyKeyword = Array.from(searchInputs).some(input => input.value.trim().length > 0);
    
    if (!isEditingOutput) {
      if (hasAnyKeyword) {
        performExtraction(); 
      } else {
        renderResult(treatmentData); 
      }
    }
  }

  function renderResult(dataList) {
    const useVat = document.getElementById('vatLine').checked;
    let finalTxt = dataList.map(item => `${item.name} ${item.price}`).join('\n');
    
    if (useVat && dataList.length > 0) {
      finalTxt += (finalTxt ? "\n\n" : "") + "부가세 10% 별도입니다 😊";
    }
    
    document.getElementById('resultBox').value = finalTxt;
    document.getElementById('resultCount').innerText = `${dataList.length}건`;
  }

  function performExtraction() {
    const searchInputs = document.querySelectorAll('.search-input');
    isEditingOutput = false; 

    let allKeywords = [];
    searchInputs.forEach(input => {
      const val = input.value.trim();
      if (val) {
        const kws = val.split(',').map(k => k.replace(/\s+/g, "").toLowerCase()).filter(k => k.length > 0);
        allKeywords = [...allKeywords, ...kws];
      }
    });

    if (allKeywords.length === 0) {
      renderResult(treatmentData);
      return;
    }

    const filtered = treatmentData.filter(item => {
      const cleanItemName = item.name.replace(/\s+/g, "").toLowerCase();
      return allKeywords.some(kw => cleanItemName.includes(kw));
    });

    renderResult(filtered);
  }

  function clearAll() {
    document.getElementById('dataInput').value = "";
    document.getElementById('resultBox').value = "";
    document.querySelectorAll('.search-input').forEach(input => input.value = "");
    treatmentData = [];
    isEditingOutput = false;
    document.getElementById('inputStatus').innerText = "READY";
    document.getElementById('resultCount').innerText = "0건";
  }

  function copyResult() {
    const resultBox = document.getElementById('resultBox');
    const text = resultBox.value;
    if (!text) return;

    const tempElem = document.createElement("textarea");
    tempElem.value = text;
    document.body.appendChild(tempElem);
    tempElem.select();
    
    try {
      document.execCommand('copy');
      const toast = document.getElementById('toast');
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    } catch (err) {}
    document.body.removeChild(tempElem);
  }
</script>

</body>
</html>
